<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地 MOD 浏览器</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/work.css"></head>
<body>
<header class="topbar"><button id="navToggle" aria-label="展开或收起导航">菜单</button><a class="brand" href="/">MOD<span>LIBRARY</span><small>你的本地模组资料库</small></a><label class="global-search"><span class="sr-only">搜索 MOD、作者、文件与中英文说明</span><input id="search" type="search" placeholder="搜索 MOD、作者、文件与中英文说明…" autocomplete="off"><kbd>/</kbd></label><span id="connection" class="muted">正在连接</span></header>
<div class="layout">
<aside id="sidebar" class="sidebar"><nav aria-label="主要功能"><button data-view="browse" class="nav active">浏览资料库</button><button data-view="favorites" class="nav">我的收藏</button><button data-view="recent" class="nav">最近浏览</button><button data-view="profiles" class="nav">我的搭配</button><button data-view="translations" class="nav">中文翻译</button><button data-view="settings" class="nav">资料与设置</button></nav><div class="section-label">游戏资料库</div><div id="games"></div><div class="sidebar-bottom">本地优先 · 选择具体文件<br>搭配清单可交给人或 AI 使用</div></aside>
<main id="main" tabindex="-1">
<section id="browseView"><div class="heading"><div><div class="eyebrow">探索 · 收藏 · 搭配</div><h1 id="pageTitle">全部游戏</h1><p id="resultSummary" class="muted">正在读取目录…</p></div><div class="browse-controls"><label class="sort-label">排序<select id="sort"><option value="downloads">下载量</option><option value="endorsements">点赞数</option><option value="updated">最近更新</option><option value="name">名称</option><option value="files">文件数量</option><option value="size">归档体积</option><option value="recent">最近浏览</option></select></label><label>每页<select id="pageSize"><option value="24">24</option><option value="48" selected>48</option><option value="96">96</option></select></label></div></div>
<button id="toggleFilters" class="filter-toggle" aria-expanded="false" aria-controls="filtersPanel">展开筛选</button>
<section id="filtersPanel" class="filters" aria-label="组合筛选"><label>用途<select id="category"><option value="">全部用途</option></select></label><label>标签规则<select id="tagMode"><option value="tagsAll">全部包含</option><option value="tagsAny">任一包含</option><option value="tagsExclude">排除</option></select></label><label>添加标签<select id="tag"><option value="">选择标签…</option></select></label><label>作者<select id="author"><option value="">全部作者</option></select></label><label>内容<select id="adult"><option value="">全部内容</option><option value="no">不含成人标记</option><option value="yes">含成人标记</option></select></label><label>中文状态<select id="translation"><option value="">全部状态</option><option value="missing">未翻译</option><option value="pending">处理中</option><option value="partial">部分完成</option><option value="complete">MOD 正文已导入</option><option value="review">待复核</option><option value="stale">原文已更新</option></select></label><label>更新日期（起）<input id="updatedFrom" type="date"></label><label>更新日期（止）<input id="updatedTo" type="date"></label><label class="check"><input type="checkbox" id="variants">多个文件</label><label class="check"><input type="checkbox" id="localImages">有本地图片</label><div class="saved-filter-controls"><select id="savedFilter" aria-label="已保存筛选"><option value="">已保存筛选…</option></select><button id="saveFilter" type="button">保存当前筛选</button><button id="deleteFilter" type="button" disabled>删除</button></div></section>
<div id="chips" class="chips" aria-label="已选筛选条件"></div><div id="cards" class="cards" aria-live="polite"></div><div id="empty" class="empty" hidden><h2>没有找到匹配的 MOD</h2><p>可以减少筛选条件，或试试原名、作者名和用途。</p><button id="emptyClear">清空筛选</button></div><div class="pagination"><button id="prevPage">上一页</button><span id="pageInfo"></span><button id="nextPage">下一页</button></div></section>
<section id="profilesView" hidden></section><section id="translationsView" hidden></section><section id="settingsView" hidden></section>
</main>
<aside id="detail" class="detail" aria-label="MOD 详情" hidden><div class="detail-top"><span class="eyebrow">MOD 详情</span><div><a id="fullDetailLink" href="/">完整详情</a><button id="closeDetail" aria-label="关闭 MOD 详情">关闭 ×</button></div></div><div id="detailHeading"></div><div class="detail-tools"><button id="detailFavorite">收藏</button><button id="detailAdd" class="primary">选择文件加入搭配</button><label class="sr-only" for="language">说明语言</label><select id="language"><option value="zh">中文优先</option><option value="original">原文</option><option value="both">双语对照</option></select></div><nav id="detailTabs" class="tabs" aria-label="详情标签"><button data-tab="overview">概览</button><button data-tab="images">图片</button><button data-tab="files">文件与变体</button><button data-tab="requirements">依赖与兼容</button><button data-tab="description">完整说明</button></nav><div id="detailBody"></div></aside>
</div>
<div id="compareTray" class="compare-tray" hidden><span id="compareSummary"></span><button id="compareOpen">比较</button><button id="compareClear">清空</button></div><div id="jobTray" class="job-tray" hidden aria-live="polite"></div><div id="toast" role="status" hidden></div>
<dialog id="compareDialog"><div class="dialog-head"><h2>具体文件比较</h2><button id="compareClose">关闭 ×</button></div><div id="compareBody"></div></dialog>
<dialog id="gallery"><div class="dialog-head"><h2 id="galleryTitle"></h2><button id="galleryClose">关闭 ×</button></div><div class="gallery-stage"><img id="galleryImage" alt="MOD 参考图片"></div><p id="galleryCaption"></p><div class="gallery-controls"><button id="galleryPrev">上一张</button><span id="galleryCount"></span><button id="galleryNext">下一张</button></div></dialog>
<dialog id="formDialog"><form id="dialogForm"><h2 id="dialogTitle"></h2><div id="dialogFields"></div><div class="actions"><button type="button" id="dialogCancel">取消</button><button type="submit" class="primary">保存</button></div></form></dialog>
<script src="/app.js"></script><script src="/editor.js"></script><script src="/work.js"></script></body></html>
