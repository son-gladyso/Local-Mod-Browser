name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned runtime
        run: python tools/bootstrap_runtime.py
      - name: Install contract-audit dependency
        run: python -m pip install jsonschema==4.26.0
      - name: Python regression
        run: .\.runtime\python.exe -X utf8 -m unittest discover -s tests -v
      - name: Contract audit
        run: python -X utf8 tests\contract_audit.py --fixture
      - name: JavaScript syntax
        run: npm run check
