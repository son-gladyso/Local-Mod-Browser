<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Before and after using Local MOD Browser</title>
  <desc id="desc">A comparison between scattered folders and a searchable local catalog.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101722"/><stop offset="1" stop-color="#1b2432"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#28c7f7"/><stop offset="1" stop-color="#ff9d4d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="600" rx="28" fill="url(#bg)"/>
  <text x="60" y="64" fill="#f3f7fb" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">From folder hunting to a local catalog</text>
  <text x="60" y="101" fill="#9eb0c3" font-family="Segoe UI,Arial,sans-serif" font-size="17">A visual summary of the problem Local MOD Browser is built to solve.</text>
  <rect x="60" y="145" width="465" height="370" rx="22" fill="#151c26" stroke="#3a4656" filter="url(#shadow)"/>
  <text x="92" y="190" fill="#ffb36b" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">BEFORE</text>
  <text x="92" y="220" fill="#e6edf4" font-family="Segoe UI,Arial,sans-serif" font-size="18">Scattered folders</text>
  <g opacity=".95">
    <path d="M104 280h105l20 23h148v117H104z" fill="#5b3f2b" stroke="#db9250" stroke-width="2"/>
    <path d="M250 253h94l18 21h117v117H250z" fill="#31455b" stroke="#6d9cc1" stroke-width="2"/>
    <path d="M174 337h113l18 21h117v117H174z" fill="#273b35" stroke="#5eaa8c" stroke-width="2"/>
    <text x="132" y="345" fill="#f6d9b4" font-family="Consolas,monospace" font-size="15">Game_A\mods\v1</text>
    <text x="276" y="318" fill="#d8ecff" font-family="Consolas,monospace" font-size="15">backup\old-copy</text>
    <text x="198" y="404" fill="#d3f2e4" font-family="Consolas,monospace" font-size="15">translations\maybe</text>
  </g>
  <text x="92" y="486" fill="#9eb0c3" font-family="Segoe UI,Arial,sans-serif" font-size="16">Hard to search · hard to compare · hard to resume</text>
  <path d="M555 329h85" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/><path d="m625 302 38 27-38 27" fill="none" stroke="#ffb36b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="675" y="145" width="465" height="370" rx="22" fill="#151c26" stroke="#3a4656" filter="url(#shadow)"/>
  <text x="707" y="190" fill="#28c7f7" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">AFTER</text>
  <text x="707" y="220" fill="#e6edf4" font-family="Segoe UI,Arial,sans-serif" font-size="18">Searchable local workspace</text>
  <rect x="707" y="248" width="400" height="40" rx="10" fill="#202c3c" stroke="#4e637b"/>
  <circle cx="735" cy="268" r="9" fill="none" stroke="#28c7f7" stroke-width="3"/><path d="m742 275 9 9" stroke="#28c7f7" stroke-width="3" stroke-linecap="round"/><text x="767" y="275" fill="#9eb0c3" font-family="Segoe UI,Arial,sans-serif" font-size="15">Search tags, authors, files...</text>
  <g>
    <rect x="707" y="314" width="120" height="118" rx="12" fill="#202c3c" stroke="#3e5269"/><rect x="843" y="314" width="120" height="118" rx="12" fill="#202c3c" stroke="#3e5269"/><rect x="979" y="314" width="128" height="118" rx="12" fill="#202c3c" stroke="#3e5269"/>
    <rect x="722" y="330" width="90" height="34" rx="8" fill="#164c68"/><rect x="858" y="330" width="90" height="34" rx="8" fill="#4d3b27"/><rect x="994" y="330" width="96" height="34" rx="8" fill="#25483e"/>
    <path d="M722 386h65M722 402h44M858 386h63M858 402h47M994 386h72M994 402h49" stroke="#9eb0c3" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="707" y="469" fill="#9eb0c3" font-family="Segoe UI,Arial,sans-serif" font-size="16">Find · compare · organize · resume</text>
</svg>
